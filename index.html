<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>R3ELio · Your memories in motion</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<section id="auth-screen" class="auth-screen"><div class="auth-card"><div class="auth-logo">r<span>.</span></div><p class="auth-kicker">PRIVATE TRAVEL STUDIO</p><h1>Benvenuto in R3ELio<span>.</span></h1><p class="auth-copy">Accedi al tuo archivio personale. I ricordi restano su questo dispositivo.</p><form id="login-form"><label for="login-email">La tua email</label><input id="login-email" type="email" autocomplete="username" required placeholder="nome@email.it"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="La tua password"><button class="auth-submit" id="login-button" type="submit">Accedi →</button></form><p id="auth-status" class="auth-status" role="status"></p><p class="auth-footnote">Accesso riservato a un solo account. Nessuna registrazione pubblica in questa app.</p></div></section>
<div id="app" class="shell hidden">
<header class="top"><button id="back" class="iconbtn hidden" aria-label="Indietro">←</button><div class="brand"><span class="logo">r<span class="dot">.</span></span><span class="brandname">R3ELio<span class="dot">.</span></span></div><div class="topright"><span class="privacy">◉ solo sul tuo dispositivo</span><button id="info" class="iconbtn" aria-label="Info privacy">ⓘ</button></div></header>
<main id="content"></main>
<nav class="bottom"><button data-tab="home" class="active"><span>⌂</span>Viaggi</button><button data-tab="studio"><span>✧</span>Studio</button><button data-tab="settings"><span>☷</span>Privacy</button></nav>
</div>
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal"><button id="close-modal" class="close" aria-label="Chiudi">×</button><div id="modal-body"></div></div></div>
<input id="file-input" type="file" accept="image/*,video/*,.heic,.heif,.mov,.mp4,.jpg,.jpeg,.png,.webp" multiple hidden>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js" defer></script>
<script src="firebase-config.js" defer></script>
<script src="auth-gate.js" defer></script></body></html>
